<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HairMagic · 发型魔镜</title>
  <meta name="description" content="用手机拍 3–5 张头像，AI 真实感试发型：20 款发型、随机种子、按日期保存。" />
  <meta name="theme-color" content="#e9ecf0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="HairMagic" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/app.css?v=2" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/",
        "@sparkjsdev/spark": "./vendor/spark/spark.module.js"
      }
    }
  </script>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <a class="brand" href="./" aria-label="HairMagic 首页">
        <svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#49d6e8"/><stop offset=".55" stop-color="#8f7cf7"/><stop offset="1" stop-color="#f39bc0"/></linearGradient></defs><path d="M6 21c0-9 5-15 11-15 5 0 9 4 9 10" fill="none" stroke="url(#bg1)" stroke-width="3" stroke-linecap="round"/><path d="M9 22c1-6 4-10 8-10 3 0 5 2 6 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="16" cy="24" r="2.2" fill="currentColor"/></svg>
        <span>HairMagic</span>
      </a>
      <button class="date-chip" id="dateChip" type="button" aria-label="切换日期">
        <span id="dateLabel">今天</span>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </header>

    <!-- STUDIO -->
    <main class="view" id="view-studio" data-view="studio">
      <section class="empty" id="studioEmpty" hidden>
        <div class="empty-visual" aria-hidden="true">
          <svg viewBox="0 0 200 200"><defs><linearGradient id="eg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#49d6e8"/><stop offset=".55" stop-color="#8f7cf7"/><stop offset="1" stop-color="#f39bc0"/></linearGradient></defs>
            <ellipse cx="100" cy="104" rx="46" ry="58" fill="none" stroke="#c7ccd4" stroke-width="1.5"/>
            <path d="M54 92c0-40 22-58 48-58s46 20 46 52" fill="none" stroke="url(#eg)" stroke-width="5" stroke-linecap="round"/>
            <g fill="#9aa2ae"><circle cx="82" cy="100" r="2.2"/><circle cx="118" cy="100" r="2.2"/><circle cx="100" cy="118" r="2"/><circle cx="100" cy="138" r="2"/><circle cx="74" cy="124" r="1.6"/><circle cx="126" cy="124" r="1.6"/></g>
            <path d="M20 104h22M158 104h22M100 18v14M100 176v14" stroke="#c7ccd4" stroke-width="1.5"/>
          </svg>
        </div>
        <h1>拍下你的头，<br />再换一万种发型。</h1>
        <p>前置摄像头会引导你拍 3–5 个角度：正面、左右侧、抬头、低头。照片只保存在这台手机上，按日期归档。</p>
        <div class="empty-actions">
          <button class="btn btn-sheen" id="startScan" type="button">开始扫描头像</button>
          <label class="btn btn-ghost">从相册选择
            <input type="file" id="pickFiles" accept="image/*" multiple hidden />
          </label>
        </div>
      </section>

      <section class="studio" id="studio" hidden>
        <div class="stage-wrap">
          <div class="stage" id="stage" aria-live="polite">
            <img class="stage-img" id="stageBase" alt="原始照片" />
            <div class="stage-after" id="stageAfterWrap"><img class="stage-img" id="stageAfter" alt="新发型效果" /></div>
            <canvas class="stage-scan" id="stageScan" aria-hidden="true"></canvas>
            <div class="compare-handle" id="compareHandle" hidden><span></span></div>
            <div class="stage-top">
              <span class="tag" id="stageAngle">正面</span>
              <span class="tag tag-quiet" id="stageInfo" hidden></span>
            </div>
            <div class="stage-bottom">
              <button class="icon-btn" id="btnCompare" type="button" aria-pressed="false" title="对比原图">
                <svg viewBox="0 0 24 24"><path d="M12 3v18M5 6h4v12H5zM15 6h4v12h-4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
                <span>对比</span>
              </button>
              <button class="icon-btn icon-btn-3d" id="btn3d" type="button" title="3D 高斯泼溅头像" hidden>
                <svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z M12 12l8-4.5M12 12v9M12 12L4 7.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
                <span>3D</span>
              </button>
              <button class="icon-btn" id="btnSave" type="button" title="保存图片" hidden>
                <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>保存</span>
              </button>
            </div>
            <div class="stage-progress" id="stageProgress" hidden><span id="stageProgressText">正在生成…</span></div>
          </div>
          <div class="angles" id="angles" role="tablist" aria-label="拍摄角度"></div>
        </div>

        <div class="panel">
          <button class="hairlen" id="hairLen" type="button">
            <span class="hairlen-label">当前发长</span>
            <span class="hairlen-value" id="hairLenValue">分析中…</span>
            <span class="hairlen-edit">调整</span>
          </button>

          <div class="looks" id="looksRow" hidden>
            <div class="row-title"><h2>今天的造型</h2><span id="looksCount"></span></div>
            <div class="looks-rail" id="looksRail"></div>
          </div>

          <div class="line-toggle" role="group" aria-label="发型类别">
            <button class="line-btn is-on" data-line="m" type="button" aria-pressed="true">男士发型</button>
            <button class="line-btn" data-line="f" type="button" aria-pressed="false">女士发型</button>
          </div>

          <div class="seg" role="tablist" aria-label="造型来源">
            <button role="tab" class="seg-btn is-on" data-mode="now" aria-selected="true">现在可剪</button>
            <button role="tab" class="seg-btn" data-mode="all" aria-selected="false">全部 20 款</button>
            <button role="tab" class="seg-btn" data-mode="seed" aria-selected="false">随机种子</button>
          </div>

          <div class="mode mode-styles" id="modeStyles">
            <p class="mode-note" id="stylesNote"></p>
            <div class="style-grid" id="styleGrid"></div>
          </div>

          <div class="mode mode-seed" id="modeSeed" hidden>
            <div class="seed-card">
              <div class="seed-head">
                <label for="seedInput">种子</label>
                <input id="seedInput" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" />
                <button class="dice" id="seedDice" type="button" aria-label="换一个随机种子">
                  <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="8.5" cy="8.5" r="1.4"/><circle cx="15.5" cy="15.5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="15.5" cy="8.5" r="1.4"/><circle cx="8.5" cy="15.5" r="1.4"/></svg>
                </button>
              </div>
              <p class="seed-desc" id="seedDesc"></p>
              <p class="seed-grow" id="seedGrow"></p>
              <div class="toggles">
                <label class="switch"><input type="checkbox" id="seedGrowOk" /><span></span>允许需要留发的造型</label>
                <label class="switch"><input type="checkbox" id="seedColor" checked /><span></span>随机发色</label>
              </div>
            </div>
          </div>

          <div class="colors-block" id="colorsBlock">
            <div class="row-title"><h2>发色</h2><span id="colorName">原色</span></div>
            <div class="colors" id="colors" role="radiogroup" aria-label="发色"></div>
          </div>

          <div class="options">
            <div class="opt">
              <span class="opt-label">生成范围</span>
              <div class="pills" data-opt="scope">
                <button class="pill is-on" data-v="one">当前角度</button>
                <button class="pill" data-v="all">全部角度</button>
              </div>
            </div>
            <div class="opt">
              <span class="opt-label">画质</span>
              <div class="pills" data-opt="quality">
                <button class="pill is-on" data-v="fast">极速</button>
                <button class="pill" data-v="hd">高清</button>
              </div>
            </div>
            <div class="opt">
              <span class="opt-label">原貌锁定</span>
              <label class="switch"><input type="checkbox" id="lockFace" checked /><span></span><em>保留五官不被 AI 改动</em></label>
            </div>
          </div>
          <div class="spacer"></div>
        </div>

        <div class="gen-bar">
          <div class="gen-summary" id="genSummary"></div>
          <button class="btn btn-sheen btn-gen" id="btnGenerate" type="button">生成造型</button>
        </div>
      </section>
    </main>

    <!-- ARCHIVE -->
    <main class="view" id="view-archive" data-view="archive" hidden>
      <div class="archive-head">
        <h1>档案</h1>
        <p>每天拍的头像和造型都按日期留在这台设备上。</p>
      </div>
      <div class="archive-list" id="archiveList"></div>
    </main>

    <nav class="tabbar" aria-label="主导航">
      <button class="tab is-on" data-go="studio" type="button">
        <svg viewBox="0 0 24 24"><path d="M5 19c0-8 3-14 8-14 4 0 6 3 6 7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="13" cy="15" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
        <span>造型</span>
      </button>
      <button class="tab tab-scan" data-go="scan" type="button" aria-label="扫描头像">
        <span class="scan-orb"><svg viewBox="0 0 24 24"><path d="M4 8V5.5A1.5 1.5 0 015.5 4H8M16 4h2.5A1.5 1.5 0 0120 5.5V8M20 16v2.5a1.5 1.5 0 01-1.5 1.5H16M8 20H5.5A1.5 1.5 0 014 18.5V16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span>
        <span>扫描</span>
      </button>
      <button class="tab" data-go="archive" type="button">
        <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4 9.5h16M9 3v4M15 3v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span>档案</span>
      </button>
    </nav>
  </div>

  <!-- CAPTURE OVERLAY -->
  <div class="capture" id="capture" hidden>
    <video id="camVideo" playsinline muted></video>
    <canvas id="camHud"></canvas>
    <div class="cap-top">
      <button class="cap-close" id="capClose" type="button" aria-label="关闭">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="cap-tip"><strong id="capTip">正在启动摄像头…</strong><span id="capSub"></span></div>
    </div>
    <div class="cap-bottom">
      <ol class="cap-steps" id="capSteps"></ol>
      <div class="cap-actions">
        <label class="cap-side" title="从相册导入">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6.5 16l4-4.5 3 3 2-2 2.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          <input type="file" id="capFiles" accept="image/*" multiple hidden />
        </label>
        <button class="shutter" id="capShutter" type="button" aria-label="手动拍摄"><span></span></button>
        <button class="cap-side cap-done" id="capDone" type="button" disabled>完成</button>
      </div>
    </div>
    <div class="cap-flash" id="capFlash"></div>
  </div>

  <!-- SHEETS -->
  <div class="sheet-scrim" id="sheetScrim" hidden></div>
  <section class="sheet" id="sheetLen" hidden aria-label="调整当前发长">
    <div class="sheet-grip"></div>
    <h2>当前发长</h2>
    <p class="sheet-note" id="lenSource">AI 根据正面照估算，可以手动修正，造型推荐会跟着变。</p>
    <div class="len-presets" id="lenPresets"></div>
    <div class="len-sliders">
      <label><span>顶部</span><input type="range" min="0.5" max="60" step="0.5" id="lenTop" /><output id="lenTopV"></output></label>
      <label><span>两侧</span><input type="range" min="0.5" max="60" step="0.5" id="lenSide" /><output id="lenSideV"></output></label>
      <label><span>后部</span><input type="range" min="0.5" max="60" step="0.5" id="lenBack" /><output id="lenBackV"></output></label>
    </div>
    <p class="sheet-note">头发平均每月长约 1.25 cm。</p>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="lenReanalyze" type="button">重新 AI 估算</button>
      <button class="btn btn-ink" id="lenDone" type="button">完成</button>
    </div>
  </section>

  <section class="sheet" id="sheetDates" hidden aria-label="选择日期">
    <div class="sheet-grip"></div>
    <h2>选择日期</h2>
    <div class="date-list" id="dateList"></div>
  </section>

  <!-- 3D VIEWER -->
  <div class="viewer3d" id="viewer3d" data-state="intro" hidden>
    <div class="v3-canvas" id="v3Canvas"></div>
    <div class="v3-top">
      <button class="cap-close" id="v3Close" type="button" aria-label="关闭">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="v3-title"><strong id="v3Title">3D 发型</strong><span>3D Gaussian Splatting</span></div>
    </div>
    <div class="v3-panel">
      <p class="v3-status" id="v3Status"></p>
      <p class="v3-sub" id="v3Sub"></p>
      <div class="v3-progress"><span id="v3Bar"></span></div>
      <button class="btn btn-sheen v3-train" id="v3Train" type="button">开始训练 3D 头像</button>
    </div>
    <div class="v3-tools">
      <p class="v3-hint">拖动旋转 · 双指缩放 · 双指平移</p>
      <div class="v3-btns">
        <button class="icon-btn" id="v3Spin" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.3-5.6M20 4v4h-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>自动旋转</span>
        </button>
        <button class="icon-btn" id="v3Reset" type="button">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>正面</span>
        </button>
        <button class="icon-btn" id="v3Save" type="button">
          <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>.ply</span>
        </button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="./js/app.js?v=2"></script>
</body>
</html>
