<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="voidGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#9b45f5" stop-opacity="0.5"/>
      <stop offset="85%" stop-color="#050608" stop-opacity="1"/>
      <stop offset="100%" stop-color="#020305" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#9b45f5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Void Circle -->
  <circle cx="64" cy="64" r="60" fill="url(#voidGrad)"/>
  
  <!-- Outer Tech Ring -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="16 8 32 8" filter="url(#glow)"/>
  <circle cx="64" cy="64" r="46" fill="none" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Center Stylized FF Void Glyph -->
  <g transform="translate(64, 64) scale(0.9)" filter="url(#glow)">
    <!-- Primary Portal Rhombus -->
    <polygon points="0,-28 24,0 0,28 -24,0" fill="none" stroke="url(#ringGrad)" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="8" fill="#00e5ff"/>
  </g>
</svg>
